<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading companion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading column on paper, and one dark "figure plate" that stays pinned while the story scrolls.
   The plate is the only loud element: it keeps its dark palette in both themes so the motion graphics read like a projected figure. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#10201f; --muted:#566b69; --line:#d2dcda; --accent:#b4500a; --accent-soft:#fbe6d3;
  --p-bg:#0b1a1d; --p-2:#12292d; --p-line:#24434a; --p-ink:#e9f2f0; --p-muted:#8eaaa8;
  --p-accent:#ffa24d; --p-ok:#5fd0b8; --p-warn:#f2c14e; --p-bad:#ff7b6b;
  --esi1:#ff5f56; --esi2:#ffa24d; --esi3:#f2c14e; --esi4:#5ccf8f; --esi5:#6fb1ff;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#081214; --surface:#0f1f22; --ink:#e6efed; --muted:#96adab; --line:#223a3f; --accent:#ffa24d; --accent-soft:#33210f; --p-bg:#0e2226; --p-2:#16343a; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#081214; --surface:#0f1f22; --ink:#e6efed; --muted:#96adab; --line:#223a3f; --accent:#ffa24d; --accent-soft:#33210f; --p-bg:#0e2226; --p-2:#16343a; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.08}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,44px)}
.mono{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:99px;vertical-align:middle;white-space:nowrap}
.ref{font-family:var(--mono);font-size:.66rem;line-height:1.5;color:var(--muted);background:none;border:1px solid var(--line);border-radius:5px;padding:1px 6px;cursor:copy;vertical-align:middle;text-align:left}
.ref:hover{color:var(--accent);border-color:var(--accent)}
#progress{position:fixed;inset:0 0 auto 0;height:calc(3px + env(safe-area-inset-top,0px));z-index:40;pointer-events:none}
#progress i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.72rem;padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:50;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* hero */
.hero{padding-block:clamp(48px,9vw,112px) clamp(32px,5vw,64px);display:flex;flex-direction:column;gap:26px}
.hero h1{font-size:clamp(2.1rem,5.4vw,4.1rem);font-weight:800;max-width:19ch}
.hero .by{color:var(--muted);font-size:1rem}
.hero .sum{font-size:clamp(1.15rem,1.9vw,1.42rem);line-height:1.45;max-width:36em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0;border-top:2px solid var(--ink)}
.facts div{padding:16px 16px 14px 0;border-bottom:1px solid var(--line)}
.facts dt{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4vw,2.9rem);line-height:1;font-variant-numeric:tabular-nums}
.facts dd{margin:6px 0 0;font-size:.9rem;line-height:1.3;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 28px;font-size:.92rem;line-height:1.4;color:var(--muted)}
.howto b{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);font-weight:500;margin-bottom:3px}

/* story */
.scrolly{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4.5vw,72px);align-items:start}
.steps{min-width:0}
.step{min-height:150vh;display:flex;align-items:center}
.step:last-child{min-height:110vh}
.step-in{display:flex;flex-direction:column;gap:18px;max-width:31em;opacity:.28;transform:translateY(10px);transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1)}
.step.on .step-in{opacity:1;transform:none}
.kick{display:flex;align-items:baseline;gap:10px}
.kick b{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--accent);font-variant-numeric:tabular-nums}
.step h2{font-size:clamp(1.7rem,3.1vw,2.6rem);font-weight:700}
.step blockquote{margin:0;padding:2px 0 2px 18px;border-left:3px solid var(--accent);font-style:italic;font-size:1.12em;line-height:1.42}
.step blockquote .ref{font-style:normal}
.stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;min-width:0;order:2}
.plate{width:100%;background:var(--p-bg);border:1px solid var(--p-line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -40px rgba(8,18,20,.7)}
.plate-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px 0;font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--p-muted)}
.plate-head .kind{border:1px solid var(--p-line);border-radius:99px;padding:2px 9px}
.plate-head .kind.schematic{color:var(--p-warn);border-color:var(--p-warn)}
.plate-body{position:relative;aspect-ratio:4/3;max-height:calc(100vh - 190px)}
.layer{position:absolute;inset:0;padding:4px 10px;opacity:0;transition:opacity .45s;pointer-events:none}
.layer.on{opacity:1}
.layer svg{width:100%;height:100%;display:block;overflow:visible}
.plate-foot{padding:0 18px 14px;display:flex;flex-direction:column;gap:10px}
.plate-cap{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-family:var(--display);font-weight:500;font-size:.86rem;line-height:1.35;color:var(--p-ink);min-height:2.7em}
.plate-cap button{flex:none;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--p-muted);background:none;border:1px solid var(--p-line);border-radius:99px;padding:4px 11px;cursor:pointer}
.plate-cap button:hover{color:var(--p-accent);border-color:var(--p-accent)}
.plate-bar{height:2px;background:var(--p-line);border-radius:2px;overflow:hidden}
.plate-bar i{display:block;height:100%;background:var(--p-accent);transform-origin:0 50%}
.rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:30}
.rail a{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);transition:all .3s}
.rail a.on{background:var(--accent);border-color:var(--accent);transform:scale(1.35)}

/* figure marks (inside the plate) */
svg text{font-family:var(--display);font-weight:500;font-size:15px;fill:var(--p-ink)}
svg .s{font-size:13.5px} svg .xs{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:400}
svg .h{font-weight:700;font-size:19px} svg .num{font-weight:800;font-size:40px} svg .big{font-weight:800;font-size:76px;letter-spacing:-.03em}
svg .mu{fill:var(--p-muted)} svg .acc{fill:var(--p-accent)} svg .ok{fill:var(--p-ok)} svg .warn{fill:var(--p-warn)} svg .bad{fill:var(--p-bad)} svg .dark{fill:var(--p-bg)}
.f-ink{fill:var(--p-ink)} .f-mu{fill:var(--p-muted)} .f-line{fill:var(--p-line)} .f-2{fill:var(--p-2)} .f-acc{fill:var(--p-accent)} .f-ok{fill:var(--p-ok)} .f-warn{fill:var(--p-warn)} .f-bad{fill:var(--p-bad)} .f-none{fill:none}
.st-ink{stroke:var(--p-ink)} .st-mu{stroke:var(--p-muted)} .st-line{stroke:var(--p-line)} .st-acc{stroke:var(--p-accent)} .st-ok{stroke:var(--p-ok)} .st-warn{stroke:var(--p-warn)} .st-bad{stroke:var(--p-bad)}
.esi1{fill:var(--esi1)} .esi2{fill:var(--esi2)} .esi3{fill:var(--esi3)} .esi4{fill:var(--esi4)} .esi5{fill:var(--esi5)}
@keyframes ring{0%{r:7;opacity:.9}100%{r:22;opacity:0}}
.ring{animation:ring 1.7s ease-out infinite}

/* after the story */
.after{display:flex;flex-direction:column;gap:clamp(64px,9vw,120px);padding-block:clamp(48px,8vw,96px) 120px}
.after section{display:flex;flex-direction:column;gap:22px}
.after h2{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:700}
.after h3{font-size:1.05rem;font-weight:700}
.lede{max-width:36em}
.explorer{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:26px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:5px}
.tabs button{font-family:var(--display);font-weight:500;font-size:.9rem;line-height:1.25;text-align:left;color:var(--ink);background:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.tabs button:hover{border-color:var(--accent)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px}
.card dl{margin:0;display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px 18px;font-size:1rem;line-height:1.45}
.card dt{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.card dd{margin:0}
.card dd.em{border-left:3px solid var(--accent);padding-left:12px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px}
.two>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:11px;font-size:1rem;line-height:1.45}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem;line-height:1.45}
th{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 16px 10px 0;border-bottom:2px solid var(--ink)}
td{padding:14px 16px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
.read-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s}
.todo{border-top:2px solid var(--ink)}
.todo label{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo input{width:19px;height:19px;margin-top:5px;accent-color:var(--accent)}
.todo b{font-family:var(--display);font-weight:700}
.todo .why{display:block;font-size:.92rem;color:var(--muted);line-height:1.35}
.todo .done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.foot{font-size:.85rem;color:var(--muted)}

@media (max-width:920px){
  body{font-size:17.5px}
  .scrolly{grid-template-columns:minmax(0,1fr);gap:0}
  .stage{order:-1;height:auto;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * clamp(16px,4vw,44px));display:block}
  .plate{border-radius:0;border-inline:0;box-shadow:0 14px 24px -18px rgba(8,18,20,.8)}
  .plate-body{max-height:36vh;aspect-ratio:auto;height:36vh}
  .plate-head{padding:8px 14px 0}
  .plate-foot{padding:0 14px 8px;gap:6px}
  .plate-cap{font-size:.74rem;min-height:0}
  .plate-cap span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .step{min-height:92vh;align-items:flex-start;padding-block:7vh 26vh}
  .step:last-child{min-height:70vh}
  .rail{display:none}
  .explorer{grid-template-columns:minmax(0,1fr)}
  .tabs{flex-direction:row;flex-wrap:wrap}
  .tabs button{font-size:.8rem;padding:6px 10px}
  .card dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .card dd{margin-bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
/* =====================================================================================================
   1. PAPER DATA. Everything about the paper lives in this block and in section 2. Nothing below
      section 2 mentions a paper. References are copied from the paper's note: page, column, line.
   ===================================================================================================== */
const PAPER = {
  key: 'agius2025',                         // unique per paper: names the saved reading ticks
  short: 'Agius 2025 Triage CTA',           // browser tab
  cite: 'Agius et al. 2025',                // prefixed when a reference is copied
  title: 'A Cognitive Task Analysis for Developing a Clinical Decision Support System for Emergency Triage',
  authors: 'Steve Agius, Caroline Magri and Vincent Cassar, University of Malta',
  venue: 'Journal of Emergency Nursing 51(6), 2025, pp. 1028–1045',
  doi: '10.1016/j.jen.2025.05.013',
  access: 'open access',
  summary: 'The authors interviewed and watched emergency triage nurses in one Maltese hospital to learn how they decide under time pressure. They turned what they found into a table of ten cognitive demands, each paired with an idea for a decision support feature. They did not build or test a system.',
  facts: [['16','nurse interviews'],['6 h','of observation, 55 triage sessions'],['26','themes coded'],['10','cognitive demands in the final table'],['0','systems built or evaluated']],
  refExample: 'p. 1035, col. 2, l. 42-44'
};
const DATA = {
  admissions: { low: 4, high: 17 },
  interviews: { n: 16, education: [ {k:'Bachelor’s', n:9, c:'f-acc'}, {k:'Master’s', n:6, c:'f-ok'}, {k:'PhD', n:1, c:'f-ink'} ] },
  observation: { sessions: 4, hoursEach: 1.5, patients: 55 },
  saturation: { at: 13, of: 16 },
  themes: {
    interview: ['Procedures','Patient flow management','Assigning patients to specialties','Specific triage protocols','Data collection for assessment','Skills employed in triage','Communication with professionals','Responding to patient deterioration','Observation cues and patterns','Experience in triage','Challenges in triage','Time constraint','Triage during peak hours','Uncertainty and incomplete information','Deviations from standard process','Verification of triage decisions'],
    observation: ['Adaptability and flexibility','Efficiency and time management','Challenges and potential risks','Distractions and environment','Communication styles, language barriers','Efficiency vs. detachment','Patient experience and privacy','Nurses’ nationality','Long shifts','Nursing approach']
  },
  queue: { n: 12, acute: [4, 8, 10] },      // schematic only: the paper gives no queue data
  esi: ['ESI 1','ESI 2','ESI 3','ESI 4','ESI 5'],
  matrix: [ ['Patient flow management','c'], ['Specific triage protocols','e'], ['Data collection for assessment','c'], ['Observation cues and patterns','c'], ['Communication with health care professionals','e'], ['Responding to patient deterioration','c'], ['Experience in triage','c'], ['Time constraint','e'], ['Triage during peak hours','c'], ['Uncertainty, incomplete information, communication barrier','c'], ['Deviations from standard triage process','c'], ['Verification of triage decisions','d'] ],
  rel: { c:{l:'confirmed', k:'ok'}, e:{l:'expanded', k:'warn'}, d:{l:'diverged', k:'bad'} },
  pipeline: [ {l:'Elicit', done:true}, {l:'Analyse', done:true}, {l:'Design ideas', done:true}, {l:'Build', done:false}, {l:'Evaluate', done:false} ],
  cdt: [
   {s:'Patient assessment', i:'Priority suggestion', n:'Patient assessment in triage',p:'p. 1031, table',why:'Balancing efficiency with accuracy in a very limited time window.',cue:'Extended waiting times for patients in the department.',str:'Prioritize cases based on severity.',err:'Rushed assessments, overlooked details, misclassified severity, inconsistent use of the protocol, delayed response to critical cases.',idea:'An automated priority suggestion system.'},
   {s:'Peak hours', i:'Flow dashboard, predictive analytics', n:'Assessment during peak hours',p:'p. 1031, table',why:'The influx of patients at peak hours.',cue:'The time-sensitive nature of emergency care.',str:'Allocate resources based on anticipated patient volume.',err:'Inefficient allocation of resources, leading to bottlenecks.',idea:'Predictive analytics to anticipate peak hours, a resource allocation algorithm, and a real-time patient flow dashboard.'},
   {s:'Data collection', i:'Voice-to-text entry', n:'Data collection for assessment',p:'p. 1031, table',why:'Gathering the pertinent information promptly enough to inform critical decisions.',cue:'The limited time window for a triage assessment.',str:'A structured template for quick data collection.',err:'Incomplete or insufficient data because of time constraints.',idea:'Voice-to-text for rapid verbal data entry.'},
   {s:'Cues and patterns', i:'AI pattern recognition', n:'Observation cues and patterns',p:'p. 1032, table',why:'Interpreting subtle cues rapidly and modifying triage levels accordingly.',cue:'Nonverbal cues: body language, facial expressions, vital signs.',str:'Ongoing training in pattern recognition and triage modification.',err:'Misreading subtle cues, inconsistent changes to triage level, difficulty applying pattern recognition consistently in fast-paced situations.',idea:'An AI component for pattern recognition and decision support, with an algorithm for automated analysis of nonverbal cues.'},
   {s:'Uncertainty, language', i:'Real-time translation', n:'Uncertainty, incomplete information and communication barriers',p:'p. 1032, table',why:'Finding ways around communication barriers, such as interpreters or mobile translation tools.',cue:'Language differences, cultural barriers, hearing impairments.',str:'A system to document language barriers.',err:'Overlooking or misinterpreting critical information, misunderstandings, decision errors from incomplete information.',idea:'A real-time translation tool inside the system.'},
   {s:'Deviations', i:'Deviation training modules', n:'Deviations from triage',p:'p. 1032, table',why:'Balancing the need to deviate with adherence to evidence-based protocols.',cue:'The tension between deviation and adherence itself.',str:'Collaboration among triage nurses to reach consensus on deviations.',err:'Inconsistent decisions about how far to deviate, and drift away from established protocols.',idea:'Training modules on deviation management.'},
   {s:'Coordination', i:'Real-time updates, not pagers', n:'Coordination with other health care professionals',p:'p. 1033, table',why:'Coordinating with diverse professionals.',cue:'The dynamic, fast-paced triage environment.',str:'A standardized communication protocol for emergencies.',err:'Miscommunication, delayed information exchange, suboptimal care and delayed responses.',idea:'A communication tool for real-time updates, replacing the basic pager system.'},
   {s:'Verification', i:'Questioning module', n:'Verification of triage decisions',p:'p. 1033, table',why:'Questioning decisions in complex situations or when uncertainty arises.',cue:'Uncertainty in complex situations.',str:'A culture of open communication for questioning.',err:'Reluctance to question decisions, no structured approach to uncertainty, overlooking critical aspects.',idea:'A questioning module for self-assessment.'},
   {s:'Seeking advice', i:'External-opinion features', n:'Seeking advice during triage',p:'p. 1033, table',why:'Seeking opinions from lead nurses, colleagues and lead doctors.',cue:'Recognizing that an outside opinion is needed.',str:'Regular collaboration and feedback sessions.',err:'Overreliance on outside opinions that delays decisions, no established channels, inconsistent collaboration.',idea:'Decision support features for seeking external opinions.'},

/* The story: 5 to 8 sections. `viz` names a visual in section 2; leave it out and the plate shows a title card.
   Body items: {t: text, p: reference, q: true for a copied quote, tag: label for AI analysis}. */
const SECTIONS = [
  { id:'problem', kicker:'The problem', title:'Triage is where a hospital decides fastest', viz:'waffle', body:[
    {t:'Triage nurses make rapid, often autonomous decisions about who is seen first. They draw on intuition, clinical experience and pattern recognition.', p:'p. 1029, col. 1, l. 13-17'},
    {t:'The paper cites a chart review in which 4% to 17% of hospital admissions involve an adverse medical event, nearly two-thirds of them preventable. Error rates in emergency departments are estimated to be 10% to 15% higher than in other hospital settings.', p:'p. 1029, col. 1, l. 44-45; col. 2, l. 10-11'} ]},
  { id:'idea', kicker:'The idea', title:'Build the support around how nurses think', viz:'sample', body:[
    {q:true, t:'“Despite their importance, cognitive processes are rarely considered in the design of CDSS, and there is limited guidance in the health care literature on how to explore them.”', p:'p. 1029, col. 2, l. 29-32'},
    {t:'So the authors ran a cognitive task analysis at Mater Dei Hospital in Malta. They interviewed 16 triage nurses, then spent 6 hours watching 55 triage sessions handled by other nurses.', p:'p. 1030, col. 2, l. 5-6, 41; p. 1034, col. 1, l. 1'},
    {t:'Interview questions were open-ended and scenario-based, with probes such as “What made you choose that action?”', p:'p. 1034, col. 1, l. 37-38'} ]},
  { id:'themes', kicker:'The analysis', title:'Twenty-six themes', viz:'themes', body:[
    {t:'Transcripts and field notes were coded in NVivo following Braun and Clarke, then sorted into CTA categories such as prioritization, uncertainty management and verification.', p:'p. 1035, col. 1, l. 40-41; col. 2, l. 6-7'},
